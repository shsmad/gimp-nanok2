# Конфигурация моста gimp-xtouch.
# Путь к файлу переопределяется переменной окружения GIMP_XTOUCH_CONFIG.

[log]
# Путь к файлу лога (относительно текущего каталога).
path = "gimp_xtouch.log"
# Уровень логирования (DEBUG|INFO|WARNING|ERROR); env GIMP_XTOUCH_LOG переопределяет.
level = "DEBUG"
# Ротация: максимальный размер файла и число архивных копий.
max_bytes = 1_000_000
backups = 3
