[flake8]
count = True
statistics = True
exclude = .tox,build
ignore = D107,D202,D203,D401,W503,E203
inline-quotes = double
max-line-length = 100
per-file-ignores=
    tests/*.py:S101,I900,S311

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
line_length = 88
combine_as_imports = True
known_first_party = tests
force_single_line = False
skip = .tox,build

[mypy]
#disallow_subclassing_any = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
# allow_redefinition = True
pretty = True
follow_imports = skip
ignore_missing_imports = True
show_error_codes = True
strict_optional = True
warn_no_return = True
# plugins = sqlmypy

[pylint.messages_control]
disable = C0330, C0326

[tool:pytest]
testpaths = tests
norecursedirs = .* venv *.egg dist build
addopts = --cov=appserver --cov-report html -p no:warnings



[pylama]
format = mccabe,pep8,pep257,pyflakes,pylint
ignore = D105,D203,D213,D101,D102,D103

[pylama:docs/conf.py]
skip = 1

[pylama:pycodestyle]
max_line_length = 100

[pylama:pep8]
max_line_length = 100

[pylama:mccabe]
complexity = 15

[pylama:pylint]
max-line-length = 100

[bdist_wheel]
universal = 1

[wheel]
universal = 1
