[project]
name = "gimp-nanok2"
version = "0.1.0"
description = "X-Touch Mini MIDI -> GIMP bridge"
authors = [
    {name = "shsmad", email = "shsmad@gmail.com"},
]
dependencies = [
    "python-rtmidi>=1.5.8",
]
requires-python = ">=3.14"
readme = "README.md"
license = {text = "MIT"}

[tool.pdm]
distribution = false

[tool.pdm.dev-dependencies]
dev = [
    "ipdb>=0.13.13",
    "ipython>=8.35.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.11.4",
    "ty>=0.0.43",
]

[tool.pdm.scripts]
_.env_file = ".env"
lint = "ruff check src tests"
typecheck = "ty check"
test = "pytest"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: требует живого X-Touch/GIMP (пропускается без env)",
]

[tool.ruff]
target-version = "py314"
exclude = [
    ".tox",
    ".git",
    "__pycache__",
    "build",
    "dist",
]
line-length = 120

[tool.ruff.lint]
ignore = [
    "A003",
    "D107",
    "D202",
    "D203",
    "D401",
]
select = [
    "A", # builtins
    "B", # bugbear
    "C4", # comprehensions
    "COM", # commas
    # "D",   # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "PT", # pytest-style
    "S", # bandit
    "SIM", # simplify
    "T1", # debugger
    "T2", # print
    "UP", # pyupgrade
    "W", # pycodestyle
]
# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

[tool.ruff.lint.isort]
lines-between-types = 1
known-first-party = ["conftest", "gimp_xtouch"]
known-local-folder = ["src"]
force-single-line = false

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PT011"]  # assert и широкий pytest.raises(ValueError) в тестах
